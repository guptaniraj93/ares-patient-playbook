name: Deploy Ares Playbook to Surge

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-surge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Override in Settings → Secrets and variables → Actions → Variables if needed.
      SURGE_DOMAIN: ${{ vars.SURGE_DOMAIN || 'ares-patient-playbook.surge.sh' }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html dist/index.html
      - name: Check Surge authentication
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error::Missing SURGE_TOKEN secret. Log in to Surge as niraj@ghc.health, mint a domain-scoped token, then add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge@latest ./dist "$SURGE_DOMAIN"
          echo "Published to https://$SURGE_DOMAIN"
